<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="navbar">

        <h1>TODO LIST</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h2>THE WINGS OF WIRE</h2>
            <h5>Dr.A.P.J Abdul Kalam</h5>
            <p>"You have to dream before your dreams can come true. Dream, dream, dream. Dreams transform into thoughts
                and thoughts result in action."</p>
            <button onclick="deletebook(event)">Delete</button>
        </div>
    </div>


    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h2>Add New Book</h2>
        <form>
            <input type="text" placeholder="Book Name" id="book-titleinput">
            <input type="text" placeholder="Author Name" id="author-nameinput">
            <textarea placeholder="Book Description" id="book-descriptioninput"></textarea>
            <button id="add-book">ADD</button>
            <button id="cancel-popup">CANCEL</button>
        </form>
    </div>


    <button class="add-button" id="add-popup-button">+</button>

    <script src="script.js"></script>
</body>

</html>
